services:
  - type: web
    name: bhoomisetu-backend
    runtime: python
    rootDir: updated_final_frotned/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./bhoomisetu.db
      - key: SECRET_KEY
        generateValue: true
